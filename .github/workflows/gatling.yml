name: Java CI with Maven

on:
  push:
    branches: ["main", "test/cristian"]
  pull_request:
    branches: ["main", "test/cristian"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      - name: Build with Maven
        run: mvn -B clean install --file pom.xml

      - name: Test Gatling with Maven
        run: mvn -B gatling:test --file pom.xml

      - name: Archive Gatling Results
        run: |
          mkdir -p artifacts
          zip -r artifacts/gatling-report.zip target/gatling/*

      - name: Upload Gatling Results
        uses: actions/upload-artifact@v4
        with:
          name: gatling-report
          path: artifacts/gatling-report.zip
